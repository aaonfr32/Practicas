$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: AaronFernandez Docs
  structure:
    - type: section
      key: section-1
      title: AaronFernandez Docs
      path: aaronfernandez-docs
      default: true
      children:
        - type: space
          key: space-1
          title: Documentation
          path: documentation
          default: true
          content:
            directory: ./documentation
    - type: section
      key: section-2
      title: HackTheBox
      path: hackthebox
      children:
        - type: space
          key: space-2
          title: Product Docs
          path: product-docs
          default: true
          draft: true
          content:
            directory: ./hackthebox/product-docs
